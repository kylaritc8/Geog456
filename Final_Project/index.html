<body>
     <div id="mapid"></div>
    <style>
        #mapid{ width: 1000px; height: 500px}
    </style>

<script>

    var map = L.map('mapid', {zoomSnap: 0.25}).setView([33.5, -84.0], 5);

    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

    var prismLayer = L.tileLayer('tmean/1900tiles/{z}/{x}/{y}.png', {
    attribution: 'PRISM Climate Group',
    opacity: 0.9
    }).addTo(map); 
</script>
