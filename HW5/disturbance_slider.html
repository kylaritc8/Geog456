<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Disturbance</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="../HW4a/disturbance.js"></script>
</head>
<body>
    <h1>Forest Disturbance in Great Smoky Mountains National Park</h1>
    <h3 id = daYear>Year</h3>
        <input id = "yearSlider" type="range" name="year" min="1919" max="2013" style="width:500px" oninput="moveSlider(this.value)" value="1920">

    <div id="mapid"></div>
    <style>
        #mapid{ width: 900px; height: 500px}
    </style>


    
    <script>
        var map = L.map('mapid').setView([35.6131, -83.5532], 10);
        L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',{
            }).addTo(map);

    function myStyle(features) {
        //console.log(features.properties.DATE) // This the property with the DATE value. 
        return {
    "color": getColor(features.properties.SURVEY_YEAR), // the color is obtained from the getColor function
    "weight": 1,
    "opacity": 0.65
        }
    };

    function getColor(d) {
        return d < myCurrentSelectionYear ? "red" : // The getColor has a parameter d which in our case is the value of a Year. If the Year is less than the Year selected in the slider, then we get blue, otherwise it returns gray
                    "gray blue" ;
    }

    var geojson = L.geoJSON(data, {style: myStyle}).addTo(map); // the entire geojson is displayed


    var myCurrentSelectionYear = 1919 // the initial year to start the data

    function moveSlider(value) { // function called by the slider that receives the value from the slider. 
        // console.log(value)
        document.getElementById('daYear').innerHTML = 'Year: ' + value // assign the value of year into the text
        myCurrentSelectionYear = value // reassign the new selected year value
        geojson.resetStyle() // leaflet method to reassign a Style. 
        // console.log(myCurrentSelectionYear)
    }

    moveSlider(myCurrentSelectionYear) // run the function moveSlider with the year 1840 to start with our first year. 



    window.onload = function() {
        document.getElementById('yearSlider').value = 1919;  
    }; // I added this section to make sure that the slider goes back to 1840 after refreshing


    </script>
</body>
</html>
