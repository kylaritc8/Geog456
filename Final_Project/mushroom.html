<!DOCTYPE html>
<html>
<head>
    <title>Mushroom Movement</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css"
        integrity="sha512-puBpdR0798OZvTTbP4A8Ix/l+A4dHDD0DGqYW6RQ+9jxkRFclaxxQb/SJAWZfWAkuyeQUytO7+7N4QKrDh+drA=="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"
        integrity="sha512-QVftwZFqvtRNi0ZyCtsznlKSWOStnDORoefr1enyq5mVL4tmKB3S/EnC3rRJcxCPavG10IcrVGSmPh6Qw5lwrg=="
        crossorigin=""></script>
    <script src="mushrooms.js"></script>
    <style>
        body { margin: 0; background: #f5f0e8; color: #333; font-family: Georgia, serif; }

        #mapid { width: 50%; height: 88vh; }

        #controls {
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f5f0e8;
            border-bottom: 1px solid #ddd;
        }

        #controls label { font-size: 0.95em; color: #666; }
        #myRange { width: 500px; accent-color: #7a5c2e; }
        #info { font-size: 0.95em; color: #7a5c2e; font-weight: bold; }

        #legend {
            position: absolute;
            bottom: 30px;
            right: 10px;
            background: rgba(245, 240, 232, 0.95);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            z-index: 1000;
            font-size: 0.8em;
            line-height: 1.8;
            color: #333;
            font-family: Georgia, serif;
        }

        #legend h4 {
            margin: 0 0 8px 0;
            font-size: 0.9em;
            color: #555;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div id="controls">
    <label>Year:</label>
    <input type="range" min="1899" max="2025" value="1899" id="myRange">
    <span id="info">1899 &nbsp;|&nbsp; 0 records</span>
</div>

<div id="mapid"></div>
<div id="legend"></div>

<script>
    const speciesConfig = {
        "Trametes versicolor":      { color: "#c07a2f", shape: "bracket"  },
        "Lactarius indigo":         { color: "#3a6fbf", shape: "round"    },
        "Laetiporus sulphureus":    { color: "#d4560a", shape: "bracket"  },
        "Pleurotus ostreatus":      { color: "#5aab7a", shape: "oyster"   },
        "Armillaria mellea":        { color: "#9b6bb5", shape: "round"    },
        "Cantharellus cibarius":    { color: "#c9a800", shape: "funnel"   },
        "Amanita verna":            { color: "#aaaaaa", shape: "round"    },
        "Coprinopsis atramentaria": { color: "#555555", shape: "tall"     },
        "Panus neostrigosus":       { color: "#c4546e", shape: "round"    },
        "Porodaedalea pini":        { color: "#7a4f2e", shape: "bracket"  },
        "Calvatia gigantea":        { color: "#999999", shape: "puffball" }
    };

    function mushroomSVG(shape, color) {
        const svgs = {
            round: `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="22" viewBox="0 0 20 22">
                    <ellipse cx="10" cy="9" rx="9" ry="7" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                    <rect x="7.5" y="14" width="5" height="7" rx="1.5" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                </svg>`,
            tall: `
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="26" viewBox="0 0 16 26">
                    <ellipse cx="8" cy="7" rx="7" ry="5" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                    <rect x="5.5" y="11" width="5" height="13" rx="1.5" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                </svg>`,
            funnel: `
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="20" viewBox="0 0 22 20">
                    <path d="M1 6 Q11 0 21 6 Q16 14 11 15 Q6 14 1 6Z" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                    <rect x="8.5" y="14" width="5" height="5" rx="1.5" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                </svg>`,
            bracket: `
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="18" viewBox="0 0 22 18">
                    <path d="M2 14 Q2 4 18 6 Q20 12 14 15 Q8 18 2 14Z" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                </svg>`,
            oyster: `
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="18" viewBox="0 0 22 18">
                    <path d="M2 10 Q6 2 14 2 Q20 2 20 10 Q20 16 11 17 Q2 16 2 10Z" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                    <rect x="9" y="15" width="4" height="4" rx="1" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                </svg>`,
            puffball: `
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="20" viewBox="0 0 22 20">
                    <circle cx="11" cy="9" r="8" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                    <ellipse cx="11" cy="17" rx="5" ry="2" fill="${color}" stroke="#fff" stroke-width="1.2"/>
                </svg>`
        };
        return svgs[shape] || svgs.round;
    }

    function makeIcon(species) {
        const cfg = speciesConfig[species] || { color: "#999", shape: "round" };
        return L.divIcon({
            className: "",
            html: mushroomSVG(cfg.shape, cfg.color),
            iconAnchor: [11, 11]
        });
    }

    // --- Legend with actual SVG symbols ---
    const legendEl = document.getElementById("legend");
    legendEl.innerHTML = `<h4>Species</h4>` +
        Object.entries(speciesConfig).map(([name, cfg]) => `
            <div class="legend-item">
                <div class="legend-icon">${mushroomSVG(cfg.shape, cfg.color)}</div>
                <i>${name}</i>
            </div>`
        ).join("");

    // --- Map ---
    var map = L.map('mapid').setView([33.5, -84.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var mushroomLayer = L.layerGroup().addTo(map);
    var slider = document.getElementById("myRange");
    var info   = document.getElementById("info");

    slider.oninput = function() {
        var year = parseInt(this.value);
        var filtered = mushroom.features.filter(function(f) {
            return f.properties.year <= year;
        });

        info.textContent = year + " \u00a0|\u00a0 " + filtered.length + " records";
        mushroomLayer.clearLayers();

        filtered.forEach(function(f) {
            var coords = f.geometry.coordinates;
            var props  = f.properties;
            L.marker([coords[1], coords[0]], { icon: makeIcon(props.species) })
             .bindPopup(`<b><i>${props.species}</i></b><br>Year: ${props.year}<br>${props.stateProvince}`)
             .addTo(mushroomLayer);
        });
    };

    window.onload = function() {
        slider.value = 1899;
        slider.oninput();
    };

    //Table
    function getNorthernmostBySpecies(features) {
    const result = {};

    features.forEach(f => {
        const species = f.properties.species;
        const lat = f.geometry.coordinates[1];

        if (!result[species] || lat > result[species]) {
            result[species] = lat;
        }
    });

    return result;
}

</script>
</body>
</html>
