<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kristy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script src="/Assessment2/kristy.js"></script>
</head>
<body>
     <div id="mapid"></div>
    <style>
        #mapid{ width: 900px; height: 500px}
    </style>

    <script>
         var map = L.map('mapid').setView([17.1, -130], 5);
       L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {}).addTo(map);

         var hurricane = L.icon({    // notice the L.icon which is a Leaflet object with properties, this is the image that is always on the map. Same as marker
        iconUrl: 'https://t3.ftcdn.net/jpg/02/87/27/22/360_F_287272210_ncUmlyXXXJClABXZ6XL9yuEY3b8mq0uU.jpg',   
          // this points to a jpg image obtained from the internet
        iconSize: [50,50], // size of the icon
        popupAnchor: [0,0] // where the icon is located relative to the lat lon of the point. 
        });

        var customPopup = "Kristy <br/><a href='https://fox5sandiego.com/weather/ap-hurricane-kristy-strengthens-into-a-category-4-storm-in-the-pacific-ocean/'><img src='https://fox5sandiego.com/wp-content/uploads/sites/15/2024/10/67196b87aec456.18850158.jpeg?w=1280' width='100' height='100' /></a>"
        
        //var customPopup = "UNC Well<br/><img src='https://static1.squarespace.com/static/57d17e77b8a79bfa4e31641d/t/58a22fd0bebafb516ad2404a/1487024089479/unc+well.png?format=1500w' width='100px'/>";
        
        L.geoJSON(kristy, {   // a
        pointToLayer: function (feature, latlng) { // b
        return L.marker(latlng, {icon: hurricane});}}) // c
        .bindPopup(customPopup) // d
        .addTo(map);
    </script>
</body>
</html>
